[project]
name = "fair-browser-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "pillow>=13.0.0",
    "sympy>=1.14.0",
]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.103",
]

[tool.pytest.ini_options]
pythonpath = ["."]
